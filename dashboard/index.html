<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Harris County Leads</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080a0d;color:#bcc8d8;font-family:'Segoe UI',sans-serif;font-size:13px}
header{background:#0f1318;border-bottom:3px solid #e8410a;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
h1{color:#fff;font-size:1.8rem;letter-spacing:.05em}
.badge{background:#e8410a;color:#fff;font-size:.6rem;padding:3px 10px;border-radius:2px;margin-left:12px;text-transform:uppercase;font-weight:700}
.kpi-bar{display:flex;background:#0f1318;border-bottom:1px solid #1c222c}
.kpi{flex:1;padding:14px 20px;border-right:1px solid #1c222c}
.kpi-label{font-size:.58rem;text-transform:uppercase;letter-spacing:.12em;color:#4e5f72;margin-bottom:6px}
.kpi-val{font-size:1.8rem;font-weight:700;color:#fff}
.toolbar{display:flex;align-items:center;gap:10px;padding:10px 20px;background:#0f1318;border-bottom:1px solid #1c222c;flex-wrap:wrap}
input,select{background:#080a0d;border:1px solid #252d3a;color:#bcc8d8;font-size:.7rem;padding:6px 10px;border-radius:2px;outline:none}
input{width:220px}
.btn{font-size:.65rem;font-weight:700;text-transform:uppercase;padding:7px 16px;border:none;border-radius:2px;cursor:pointer}
.btn-export{background:#e8410a;color:#fff}
.spacer{flex:1}
.tbl-wrap{overflow-x:auto;padding-bottom:50px}
table{width:100%;border-collapse:collapse;min-width:1000px}
thead tr{background:#0f1318;border-bottom:2px solid #e8410a}
th{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:#4e5f72;padding:10px 14px;text-align:left;white-space:nowrap}
tbody tr{border-bottom:1px solid #1c222c}
tbody tr:hover{background:rgba(232,65,10,.06)}
td{padding:9px 14px;font-size:.7rem;vertical-align:top;white-space:nowrap}
td.wrap{white-space:normal;max-width:200px}
.pill{display:inline-block;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:2px;text-align:center;min-width:36px}
.hi{background:rgba(232,65,10,.2);color:#e8410a;border:1px solid rgba(232,65,10,.4)}
.mid{background:rgba(240,165,0,.15);color:#f0a500;border:1px solid rgba(240,165,0,.3)}
.lo{background:rgba(37,45,58,.8);color:#4e5f72;border:1px solid #252d3a}
.chips{display:flex;flex-wrap:wrap;gap:3px;max-width:260px}
.chip{font-size:.55rem;text-transform:uppercase;padding:2px 6px;border-radius:2px;white-space:nowrap}
.c-lp{background:rgba(232,65,10,.2);color:#f07050}
.c-fc{background:rgba(255,60,80,.18);color:#ff6b7a}
.c-jud{background:rgba(240,165,0,.18);color:#f0a500}
.c-tax{background:rgba(255,220,50,.12);color:#f0c040}
.c-llc{background:rgba(59,158,255,.15);color:#3b9eff}
.c-new{background:rgba(0,220,120,.18);color:#00dc78}
.c-def{background:#252d3a;color:#4e5f72}
a{color:#3b9eff;font-size:.65rem}
.status{position:fixed;bottom:0;left:0;right:0;background:#0f1318;border-top:1px solid #1c222c;padding:8px 20px;font-size:.62rem;color:#4e5f72}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center">
    <h1>Harris County Leads</h1>
    <span class="badge">TX · Motivated Sellers</span>
  </div>
  <div style="font-size:.7rem;color:#4e5f72">Last updated: <b style="color:#00b87a">2026-04-27</b></div>
</header>
<div class="kpi-bar">
  <div class="kpi"><div class="kpi-label">Total Leads</div><div class="kpi-val" style="color:#e8410a" id="k-total">3</div></div>
  <div class="kpi"><div class="kpi-label">With Address</div><div class="kpi-val" style="color:#00b87a" id="k-addr">2</div></div>
  <div class="kpi"><div class="kpi-label">Score ≥ 70</div><div class="kpi-val" style="color:#f0a500" id="k-high">2</div></div>
  <div class="kpi"><div class="kpi-label">Lis Pendens</div><div class="kpi-val" style="color:#3b9eff" id="k-lp">1</div></div>
  <div class="kpi"><div class="kpi-label">Foreclosure</div><div class="kpi-val" id="k-fc">1</div></div>
  <div class="kpi"><div class="kpi-label">New This Week</div><div class="kpi-val" style="color:#00b87a" id="k-new">2</div></div>
</div>
<div class="toolbar">
  <input id="q" type="text" placeholder="Search owner, doc #, address…" oninput="filter()"/>
  <select id="f-cat" onchange="filter()">
    <option value="">All Types</option>
    <option value="LP">Lis Pendens</option>
    <option value="NOFC">Foreclosure</option>
    <option value="JUD">Judgment</option>
    <option value="LN">Lien</option>
  </select>
  <div class="spacer"></div>
  <button class="btn btn-export" onclick="exportCSV()">⬇ Export GHL CSV</button>
</div>
<div class="tbl-wrap">
<table>
<thead><tr>
  <th>Score</th><th>Filed</th><th>Lead Type</th><th>Doc #</th>
  <th>Owner</th><th>Amount</th><th>Property Address</th>
  <th>Mailing Address</th><th>Flags</th><th>Link</th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
<div class="status">Harris County Clerk · cclerk.hctx.net &nbsp;|&nbsp; <span id="cnt">3 records</span></div>
<script>
const DATA=[
  {doc_num:"2026-001234",doc_type:"LP",filed:"2026-04-25",cat:"LP",cat_label:"Lis Pendens",owner:"SMITH JOHN",grantee:"BANK OF AMERICA",amount:185000,prop_address:"1234 Memorial Dr",prop_city:"Houston",prop_state:"TX",prop_zip:"77007",mail_address:"1234 Memorial Dr",mail_city:"Houston",mail_state:"TX",mail_zip:"77007",clerk_url:"https://cclerk.hctx.net",flags:["Lis pendens","New this week"],score:75},
  {doc_num:"2026-001235",doc_type:"NOFC",filed:"2026-04-24",cat:"NOFC",cat_label:"Notice of Foreclosure",owner:"GARCIA MARIA LLC",grantee:"WELLS FARGO",amount:220000,prop_address:"5678 Westheimer Rd",prop_city:"Houston",prop_state:"TX",prop_zip:"77056",mail_address:"PO BOX 1234",mail_city:"Houston",mail_state:"TX",mail_zip:"77056",clerk_url:"https://cclerk.hctx.net",flags:["Pre-foreclosure","LLC / corp owner","New this week"],score:85},
  {doc_num:"2026-001236",doc_type:"JUD",filed:"2026-04-23",cat:"JUD",cat_label:"Judgment",owner:"JOHNSON ROBERT",grantee:"IRS",amount:95000,prop_address:"",prop_city:"",prop_state:"TX",prop_zip:"",mail_address:"9012 Heights Blvd",mail_city:"Houston",mail_state:"TX",mail_zip:"77008",clerk_url:"https://cclerk.hctx.net",flags:["Judgment lien","Tax lien"],score:65}
];
const FC={'Lis pendens':'c-lp','Pre-foreclosure':'c-fc','Judgment lien':'c-jud','Tax lien':'c-tax','LLC / corp owner':'c-llc','New this week':'c-new'};
let filtered=[...DATA];
function filter(){
  const q=document.getElementById('q').value.toLowerCase();
  const cat=document.getElementById('f-cat').value;
  filtered=DATA.filter(r=>{
    const t=[r.doc_num,r.owner,r.prop_address,r.mail_address].join(' ').toLowerCase();
    if(q&&!t.includes(q))return false;
    if(cat&&r.cat!==cat)return false;
    return true;
  });
  render();
}
function render(){
  const tbody=document.getElementById('tbody');
  document.getElementById('cnt').textContent=filtered.length+' records';
  tbody.innerHTML=filtered.map(r=>{
    const s=r.score||30;
    const pc=s>=70?'hi':s>=50?'mid':'lo';
    const chips=(r.flags||[]).map(f=>'<span class="chip '+(FC[f]||'c-def')+'">'+f+'</span>').join('');
    const amt=r.amount?'$'+r.amount.toLocaleString():'—';
    const prop=[r.prop_address,r.prop_city,r.prop_state,r.prop_zip].filter(Boolean).join(', ')||'—';
    const mail=[r.mail_address,r.mail_city,r.mail_state,r.mail_zip].filter(Boolean).join(', ')||'—';
    const link=r.clerk_url?'<a href="'+r.clerk_url+'" target="_blank">View ↗</a>':'—';
    return '<tr><td><span class="pill '+pc+'">'+s+'</span></td><td>'+r.filed+'</td><td>'+r.cat_label+'</td><td style="color:#3b9eff">'+r.doc_num+'</td><td class="wrap">'+r.owner+'</td><td>'+amt+'</td><td class="wrap">'+prop+'</td><td class="wrap">'+mail+'</td><td><div class="chips">'+chips+'</div></td><td>'+link+'</td></tr>';
  }).join('');
}
function exportCSV(){
  const cols=['First Name','Last Name','Mailing Address','Mailing City','Mailing State','Mailing Zip','Property Address','Property City','Property State','Property Zip','Lead Type','Document Type','Date Filed','Document Number','Amount/Debt Owed','Seller Score','Motivated Seller Flags','Source','Public Records URL'];
  const lines=[cols.join(',')];
  filtered.forEach(r=>{
    const p=(r.owner||'').split(' ');
    const cells=[p[0]||'',p.slice(1).join(' ')||'',r.mail_address||'',r.mail_city||'',r.mail_state||'TX',r.mail_zip||'',r.prop_address||'',r.prop_city||'',r.prop_state||'TX',r.prop_zip||'',r.cat_label||'',r.doc_type||'',r.filed||'',r.doc_num||'',r.amount||'',r.score||30,(r.flags||[]).join('; '),'Harris County Clerk',r.clerk_url||''].map(v=>'"'+String(v).replace(/"/g,'""')+'"');
    lines.push(cells.join(','));
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'text/csv'}));
  a.download='harris_leads.csv';a.click();
}
render();
</script>
</body>
</html>
